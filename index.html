<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Límite o Nada</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <img src="public/limiteNada.png">
    </div>
    
    <div class="question-container question">
      <div class="question-text" id="question-text">
        Cargando pregunta...
      </div>
    </div>

    <div class="options-grid" id="options-container">
      <!-- Las opciones se generan vía JS -->
    </div>

    <div class="controls">
      <p id="status-text" class="status-text"></p>
      <div id="explanation-container" class="explanation-box" style="display: none;"></div>
      <button id="next-btn" class="next-btn" style="display: none;">Siguiente Pregunta</button>
    </div>
  </div>
  <script src="./src/main.js" defer></script>
</body>
</html>
